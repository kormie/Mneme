name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: spec integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-spec.sh

  helix:
    name: helix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helix
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  proofs:
    name: lean laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain') }}
      - name: install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: ./scripts/sync-lean.sh
      - run: cd proofs && lake build
