name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: spec integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-spec.sh

  helix:
    name: helix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helix
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: helix/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun src/judge.ts

  proofs:
    name: lean laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain') }}
      - name: install elan
        run: ./scripts/install-elan.sh
      - run: ./scripts/sync-lean.sh
      - run: cd proofs && lake build

  bend:
    name: bend laws
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.bend
          key: bend-${{ runner.os }}-${{ hashFiles('bend/.bend-version', 'bend/.bend-lean-toolchain', 'scripts/install-bend.sh') }}
      - name: install bend
        run: ./scripts/install-bend.sh
      - run: cd bend && bend PROOF.bend
      # `--verdict` builds Bend's proven kernel (bendtt.lean) with the Lean
      # toolchain in bend/.bend-lean-toolchain. That is not the toolchain the
      # `lean laws` job uses (proofs/lean-toolchain), so it has its own cache.
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-bend-${{ runner.os }}-${{ hashFiles('bend/.bend-lean-toolchain') }}
      - name: install elan
        run: ./scripts/install-elan.sh
      - name: install the Lean that builds Bend's proven kernel
        run: elan default "$(cat bend/.bend-lean-toolchain)"
      - name: recheck with the proven kernel
        run: cd bend && bend PROOF.bend --verdict

  differential:
    name: differential
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: helix/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: helix
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain') }}
      - name: install elan
        run: ./scripts/install-elan.sh
      # Lean evaluates the pack's own predicates, so the proofs must be built.
      - run: ./scripts/sync-lean.sh
      - run: cd proofs && lake build
      - uses: actions/cache@v4
        with:
          path: ~/.bend
          key: bend-${{ runner.os }}-${{ hashFiles('bend/.bend-version', 'bend/.bend-lean-toolchain', 'scripts/install-bend.sh') }}
      - name: install bend
        run: ./scripts/install-bend.sh
      # Runs Lean, Bend and the TypeScript mirrors on the same seeded corpus
      # and fails on any disagreement with Lean (the certificate of record).
      - name: compare Lean, Bend and the TypeScript mirrors
        run: bun src/differential.ts
        working-directory: helix
