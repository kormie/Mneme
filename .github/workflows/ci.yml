name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: spec integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-spec.sh

  helix:
    name: helix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helix/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  proofs:
    name: lean laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain') }}
      - name: install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: ./scripts/sync-lean.sh
      - run: cd proofs && lake build
